name: Build & Push Image to CMC Registry

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: arc-runner-set

    env:
      REGISTRY: registry-01.cloud.cmctelecom.vn
      IMAGE_NAME: default-3121-82stk65zpamq/test-repository

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to CMC Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.CMC_REGISTRY_USER }}
          password: ${{ secrets.CMC_REGISTRY_TOKEN }}

      - name: Set up Docker Buildx (remote BuildKit)
        uses: docker/setup-buildx-action@v3
        with:
          driver: remote
          endpoint: tcp://buildkit.buildkit.svc.cluster.local:1234

      - name: Build & Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
